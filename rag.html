<!DOCTYPE html>
<html>
<head>
    <title>RAG Application</title>

    <style>
        body{
            font-family:Arial;
            background:#f2f2f2;
            padding:40px;
        }

        .container{
            background:white;
            padding:30px;
            border-radius:10px;
        }

        input{
            width:80%;
            padding:10px;
        }

        button{
            padding:10px 20px;
            background:blue;
            color:white;
            border:none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>RAG Application</h1>

    <form method="POST" action="/ask">

        <input
            type="text"
            name="question"
            placeholder="Ask something..."
            required
        >

        <button type="submit">
            Submit
        </button>

    </form>

</div>

</body>
</html>
